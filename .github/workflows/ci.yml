name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Lint workspace
        run: cargo clippy --workspace -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

  adapter-tests:
    name: Adapter fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: adapters/pi-durable
      - name: Adapter conformance (every adapter must ship fixtures)
        run: bun run ./adapters/conformance.ts
      - name: Adapter regression tests
        run: |
          for test in adapters/*/test.js adapters/*/*-test.js adapters/test-new-harnesses.js; do
            [ -f "$test" ] || continue
            echo "== $test"
            bun run "./$test"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.1'
      - run: bun install --frozen-lockfile && bun run typecheck && bun test && bun run test:sqlite
        working-directory: adapters/pi-durable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo build -p hstry-cli
      - run: bun adapters/pi-durable/cli-proof.ts

  web-ui:
    name: Web UI and Oqto App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/.bun-version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc and jq
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler jq
      - name: Committed bundles match web/ sources
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build.ts
          git diff --exit-code -- ../crates/hstry-api/ui/index.html ../oqto/hstry.oqtoapp/bundle/index.html
      - run: cargo build -p hstry-cli
      - name: Typecheck and tests (including the Oqto App data path)
        working-directory: web
        run: |
          bun run typecheck
          bun test
