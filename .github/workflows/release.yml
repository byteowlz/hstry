# Canonical versioned archives, checksums and package-manager publication (ADR-0021).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v0.5.28)
        required: true
        type: string

jobs:
  release:
    permissions:
      contents: write
      packages: read
    uses: byteowlz/byt/.github/workflows/release.yml@main
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}
