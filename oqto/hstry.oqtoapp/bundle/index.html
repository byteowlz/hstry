	padding: calc(var(--u) * 2) calc(var(--u) * 3);
	font-size: 12px;
	color: var(--muted-foreground);
	border-bottom: 1px solid var(--border);
	margin-bottom: calc(var(--u) * 1);
}

.menu-item {
	display: flex;
	width: 100%;
	justify-content: space-between;
	gap: calc(var(--u) * 3);
	padding: calc(var(--u) * 2) calc(var(--u) * 3);
	border: 0;
	background: transparent;
	text-align: left;
	cursor: pointer;
	border-radius: var(--radius-md, 4px);
}

.menu-item:hover,
.menu-item:focus-visible {
	background: var(--state-hover, var(--secondary));
	outline: none;
}

.menu-detail {
	color: var(--muted-foreground);
	font-size: 12px;
}

.toast {
	position: fixed;
	left: 50%;
	bottom: calc(var(--u) * 6);
	transform: translate(-50%, 12px);
	padding: calc(var(--u) * 2.5) calc(var(--u) * 4);
	background: var(--popover, var(--card));
	color: var(--popover-foreground, var(--foreground));
	border: 1px solid var(--border);
	border-left: 3px solid var(--success);
	border-radius: var(--radius-lg, 4px);
	box-shadow: var(--shadow-md, 0 10px 30px color-mix(in srgb, black 30%, transparent));
	opacity: 0;
	pointer-events: none;
	transition:
		opacity 0.15s,
		transform 0.15s;
	max-width: calc(100vw - 32px);
}

.toast.visible {
	opacity: 1;
	transform: translate(-50%, 0);
}

.text-dialog {
	width: min(720px, calc(100vw - 32px));
	background: var(--popover, var(--card));
	color: var(--popover-foreground, var(--foreground));
	border: 1px solid var(--border);
	border-radius: var(--radius-lg, 4px);
	padding: calc(var(--u) * 5);
}

.text-dialog::backdrop {
	background: color-mix(in srgb, black 45%, transparent);
}

.text-dialog h2 {
	margin: 0 0 calc(var(--u) * 3);
	font-size: 15px;
}

.text-dialog textarea {
	width: 100%;
	font-family: var(--font-mono, ui-monospace, monospace);
	font-size: 12.5px;
	background: var(--code-bg, var(--muted));
	border: 1px solid var(--border);
	border-radius: var(--radius-md, 4px);
	padding: calc(var(--u) * 2);
	margin-bottom: calc(var(--u) * 3);
}

/* ---------------------------------------------------------------- narrow */

@media (max-width: 819px) {
	.topbar {
		flex-wrap: wrap;
		gap: calc(var(--u) * 2);
		padding: calc(var(--u) * 2) calc(var(--u) * 3);
	}

	.search {
		order: 3;
		flex-basis: 100%;
		max-width: none;
	}

	.key-hint,
	.actions kbd {
		display: none;
	}

	.body {
		grid-template-columns: 1fr;
	}

	.app[data-pane="list"] .detail-pane,
	.app[data-pane="detail"] .list-pane {
		display: none;
	}

	.detail-header {
		padding: calc(var(--u) * 3) calc(var(--u) * 4);
	}

	.detail-scroll {
		padding: calc(var(--u) * 3) calc(var(--u) * 4) calc(var(--u) * 16);
	}
}

@media (prefers-reduced-motion: reduce) {
	.toast {
		transition: none;
	}
}
